version: '3.8'
services:

  nginx:
    image: nginx:1.25-alpine
    container_name: lab02-nginx
    ports:
      - "9443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      dmz:
        ipv4_address: 192.168.102.2
    depends_on: [nodeapi]
    restart: unless-stopped

  nodeapi:
    build:
      context: ./node-api
    container_name: lab02-nodeapi
    networks:
      dmz:
        ipv4_address: 192.168.102.10
      internal:
        ipv4_address: 10.10.102.10
    environment:
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_URL: "http://flask-ssrf:8080"
      NODE_ENV: ${NODE_ENV}
    expose: ["3000"]
    restart: unless-stopped

  flask-ssrf:
    build:
      context: ./flask-ssrf
    container_name: lab02-flask
    networks:
      internal:
        ipv4_address: 10.10.102.20
    expose: ["8080"]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lab02-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      internal:
        ipv4_address: 10.10.102.30
    expose: ["6379"]
    restart: unless-stopped

  forensics:
    image: python:3.11-slim
    container_name: lab02-forensics
    ports:
      - "9090:9090"
    networks:
      dmz:
        ipv4_address: 192.168.102.50
    volumes:
      - ./forensics:/data:ro
    command: python -m http.server 9090 --directory /data
    restart: unless-stopped

  volatility:
    build:
      context: ./volatility3
    container_name: lab02-volatility
    ports:
      - "8888:8888"
    networks:
      dmz:
        ipv4_address: 192.168.102.60
    volumes:
      - ./forensics:/memory:ro
    restart: unless-stopped

networks:
  dmz:
    driver: bridge
    internal: false
    ipam:
      config:
        - subnet: 192.168.102.0/24
          gateway: 192.168.102.1
  internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.10.102.0/24
          gateway: 10.10.102.1
