apiVersion: v1
kind: ConfigMap
metadata:
  name: falco-custom-rules
  namespace: lab-expert
data:
  lab_rules.yaml: |
    # ── Lab04 Custom Falco Rules ──────────────────────────────
    - rule: Lab04 Docker Socket Access
      desc: Detecta acceso al socket de Docker dentro de un container
      condition: >
        spawned_process and
        (fd.name = "/var/run/docker.sock" or proc.args contains "docker.sock")
      output: >
        ALERT Docker socket accessed
        (user=%user.name cmd=%proc.cmdline container=%container.name
        pod=%k8s.pod.name ns=%k8s.ns.name)
      priority: CRITICAL
      tags: [container_escape, T1610, lab04]

    - rule: Lab04 K8s SA Token Read
      desc: Proceso no autorizado lee el token del ServiceAccount
      condition: >
        open_read and
        fd.name startswith "/var/run/secrets/kubernetes.io" and
        not proc.name in (kubelet, kube-proxy, falco)
      output: >
        ALERT SA Token read
        (proc=%proc.name pid=%proc.pid cmd=%proc.cmdline
        pod=%k8s.pod.name)
      priority: HIGH
      tags: [credential_access, T1528, lab04]

    - rule: Lab04 Suspicious Outbound
      desc: Conexión saliente sospechosa desde un pod del lab
      condition: >
        outbound and
        k8s.ns.name = "lab-expert" and
        not fd.sip in (k8s_api_server)
      output: >
        ALERT Outbound connection from lab pod
        (src=%fd.cip dst=%fd.sip:%fd.sport pod=%k8s.pod.name)
      priority: WARNING
      tags: [exfiltration, T1041, lab04]

    - rule: Lab04 Privilege Escalation
      desc: Detecta intentos de escalada de privilegios
      condition: >
        spawned_process and
        (proc.name in (sudo, su, newgrp) or
         proc.args contains "chmod +s" or
         proc.args contains "setuid")
      output: >
        ALERT Privilege escalation attempt
        (proc=%proc.name args=%proc.args user=%user.name
        pod=%k8s.pod.name)
      priority: CRITICAL
      tags: [privilege_escalation, T1548, lab04]
