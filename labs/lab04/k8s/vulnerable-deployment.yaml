# ================================================================
# Lab04 — Deployment intencionalmente misconfigured (educativo)
# Demuestra: over-privileged SA, privileged container,
#            hardcoded secrets, docker.sock mount
# ================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-overprivileged-sa
  namespace: lab-expert
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lab-overprivileged-binding
subjects:
  - kind: ServiceAccount
    name: lab-overprivileged-sa
    namespace: lab-expert
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-api
  namespace: lab-expert
  labels:
    app: vulnerable-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vulnerable-api
  template:
    metadata:
      labels:
        app: vulnerable-api
    spec:
      serviceAccountName: lab-overprivileged-sa
      containers:
        - name: api
          image: python:3.11-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              pip install flask -q &&
              python3 -c "
              from flask import Flask, jsonify
              import os
              app = Flask(__name__)
              @app.route('/')
              def idx(): return jsonify({'service':'lab04-vuln-api','namespace':os.environ.get('POD_NAMESPACE','unknown')})
              @app.route('/flag')
              def flag(): return jsonify({'flag':'FLAG{k8s_cl4st3r_4dm1n_t4k30v3r'})
              app.run('0.0.0.0', 80)
              "
          ports:
            - containerPort: 80
          securityContext:
            privileged: true           # MISCONFIG intencional — educativo
            allowPrivilegeEscalation: true
          env:
            - name: DB_PASSWORD
              value: "hardcoded_secret_DO_NOT_DO_THIS"   # MISCONFIG — educativo
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - mountPath: /var/run/docker.sock
              name: docker-sock
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock   # MISCONFIG — educativo
---
apiVersion: v1
kind: Service
metadata:
  name: vulnerable-api
  namespace: lab-expert
spec:
  selector:
    app: vulnerable-api
  ports:
    - port: 80
      targetPort: 80
  type: NodePort
