id: hard-forensic-pcap
name: "NetCapture Corp — HTTP Traffic Analysis"
category: forensic
description: |
  Se capturó tráfico HTTP de la red interna de CorpSec durante un incidente.
  La flag fue filtrada accidentalmente en dos peticiones HTTP distintas.
  Analiza el stream completo y reconstruye el secreto concatenando ambas partes.

  Tipo de archivo: HTTP Stream Export (texto plano)
  Herramientas: strings, grep, python, curl

ports:
  - 80
timeout: 1800
