id: hard-pwn-heap
name: "HEAP Corp — Use-After-Free"
category: pwn
description: |
  HEAP Corp expuso su gestor de notas interno.
  El código libera memoria pero olvida limpiar el puntero.
  El allocator de glibc tiene memoria, y tiene memoria larga.

  La función win() existe y tiene dirección fija. Hazla ejecutar.

  Protections: NX=on | PIE=off | Canary=off | RELRO=partial
  Architecture: x86-64 ELF, Ubuntu 22.04 glibc (tcache)
  Vulnerability: Use-After-Free + function pointer overwrite

ports:
  - 9999
  - 80

timeout: 1800
