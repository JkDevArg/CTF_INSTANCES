id: medium-misc-matbot
name: "MathBot Corp — Verificación Automática"
category: misc
description: |
  Un bot de verificación matemática espera conexiones en el puerto 9999.
  Responde 50 operaciones aritméticas (suma, resta, multiplicación) en 30 segundos.
  Si eres suficientemente rápido, la flag es tuya.

  Pista: no puedes hacerlo a mano. Escribe un script.

ports:
  - 9999
  - 80
timeout: 1800
