id: api-hardcore-jwt-confusion
name: SecureAuth
category: api
difficulty: hardcore
ports:
  - 80
timeout: 3600
description: >
  Un sistema de autenticacion empresarial firma tokens JWT con RSA (RS256).
  La clave publica esta disponible publicamente. La implementacion acepta
  multiples algoritmos. La confusion entre algoritmos asimetricos y simetricos
  puede llevar a la forja de tokens con privilegios arbitrarios.
tags:
  - jwt
  - algorithm-confusion
  - crypto
  - api
  - authentication
