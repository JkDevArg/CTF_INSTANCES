id: hard-rev-golang
name: "GoCorp — GoCrackMe v1.0"
category: reversing
description: |
  Un crackme compilado en Go. Sin símbolos de debug, sin source code.
  El binario verifica tu input — encuentra el secreto que esconde.

  Go compila estáticamente, lo que hace el binario grande pero predecible.
  Los strings y la lógica de comparación son recuperables con las herramientas correctas.

  Técnica: Static analysis de binario Go (strings, Ghidra, GoReSym, XOR decode)
ports:
  - 80
timeout: 1800
