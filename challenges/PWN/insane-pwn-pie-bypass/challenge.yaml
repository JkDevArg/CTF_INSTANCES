id: insane-pwn-pie-bypass
name: "SafeBox Corp — PIE Partial Overwrite"
category: pwn
description: |
  PIE habilitado — las direcciones cambian con cada ejecución.
  Pero el buffer overflow es exactamente de 2 bytes de sobrescritura del retorno.
  Los últimos 12 bits de la dirección de win() son fijos.

  Técnica: Partial overwrite de return address con PIE enabled.
  Probabilidad de éxito: 1/16 por intento — automatiza el brute force.

  Protections: NX=on | PIE=on | Canary=off | RELRO=full

ports:
  - 9999
  - 80
timeout: 1800
