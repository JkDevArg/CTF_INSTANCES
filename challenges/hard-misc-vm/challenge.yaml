id: hard-misc-vm
name: "MateVM Corp — Reverse the Bytecode"
category: misc
description: |
  Una maquina virtual personalizada (MateVM v1.0) fue encontrada con un programa compilado.
  Al ejecutarlo, la salida es basura.
  Analiza el interprete (vm.py) y el ISA (isa.md) para entender por que.
  Luego extrae la flag sin ejecutar el programa.

  Tecnica: reversing de bytecode + analisis de LFSR

ports:
  - 80
timeout: 1800
