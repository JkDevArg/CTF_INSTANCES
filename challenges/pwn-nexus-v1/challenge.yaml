id: pwn-nexus-v1
name: "NEXUS Terminal v1 — ret2libc"
category: pwn
description: |
  NEXUS Corp left their internal authentication terminal exposed.
  The binary has NX enabled but no PIE and no stack canary.
  There is no win() function. You'll need to build the ROP chain yourself.

  Protections: NX=on | PIE=off | Canary=off | RELRO=partial
  Architecture: x86-64 ELF, Ubuntu 22.04 glibc

ports:
  - 9999
  - 80

timeout: 1800
