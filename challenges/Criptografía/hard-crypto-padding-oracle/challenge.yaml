id: hard-crypto-padding-oracle
name: "CipherCorp — AES-CBC Padding Oracle"
category: cryptography
description: |
  Un servicio de descifrado AES-CBC expone información sobre el padding.
  Cuando el padding es inválido, responde diferente a cuando es válido.
  Usa esta diferencia para recuperar el plaintext byte a byte.

  Técnica: Padding Oracle Attack (Vaudenay, 2002)
  ~4096 peticiones al oráculo son suficientes.

ports:
  - 80
timeout: 1800
