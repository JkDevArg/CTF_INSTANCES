id: insane-pwn-rop-syscall
name: "MINIMALIST Corp — Raw Syscall ROP"
category: pwn
description: |
  Buffer overflow en un binario compilado de forma estática.
  No hay libc dinámica. No hay system(). No hay gadgets obvios de libc.

  Construye un ROP chain para ejecutar execve("/bin/sh", NULL, NULL)
  usando gadgets del binario estático y syscalls directas del kernel.

  Técnica: ROP chain con syscall directo (execve = syscall 59)
  Protections: NX=on | PIE=off | Canary=off | RELRO=partial | Static=yes

ports:
  - 9999
  - 80
timeout: 1800
