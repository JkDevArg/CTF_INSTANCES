id: insane-crypto-rsa-wiener
name: "RSACorp — Wiener's Attack"
category: cryptography
description: |
  RSA con un exponente privado 'd' inusualmente pequeño.
  La eficiencia tiene un precio: la seguridad.

  Teorema de Wiener (1990): si d < n^0.25 / 3, el exponente privado
  puede recuperarse mediante la expansión en fracciones continuas de e/n.

  Técnica: Wiener's Attack via continued fractions

ports:
  - 80
timeout: 1800
