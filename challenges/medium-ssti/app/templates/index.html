<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jinja2 Template Tester</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d1117; color: #c9d1d9; font-family: 'Courier New', monospace; padding: 40px 20px; }
    .container { max-width: 750px; margin: 0 auto; }
    h1 { color: #58a6ff; font-size: 1.6rem; margin-bottom: 6px; }
    .subtitle { color: #8b949e; font-size: 0.9rem; margin-bottom: 30px; }
    label { display: block; color: #8b949e; font-size: 0.85rem; margin-bottom: 6px; }
    textarea { width: 100%; background: #161b22; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font-family: 'Courier New', monospace; font-size: 0.95rem; padding: 14px; resize: vertical; outline: none; }
    textarea:focus { border-color: #58a6ff; }
    .btn { background: #238636; color: white; border: none; padding: 10px 24px; border-radius: 6px; font-size: 0.95rem; cursor: pointer; margin-top: 12px; font-family: inherit; }
    .btn:hover { background: #2ea043; }
    .output-box { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 16px; margin-top: 24px; min-height: 60px; white-space: pre-wrap; word-break: break-all; font-size: 0.95rem; }
    .output-label { color: #8b949e; font-size: 0.8rem; margin-bottom: 8px; }
    .error-box { background: #2d1117; border: 1px solid #f85149; border-radius: 6px; padding: 14px; margin-top: 24px; color: #f85149; font-size: 0.9rem; }
    .info { background: #161b22; border-left: 3px solid #58a6ff; padding: 12px 16px; margin-top: 30px; font-size: 0.82rem; color: #8b949e; border-radius: 0 4px 4px 0; }
    .info code { color: #79c0ff; background: #0d1117; padding: 1px 5px; border-radius: 3px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>&#128296; Jinja2 Template Tester</h1>
    <p class="subtitle">Preview how your Jinja2 templates render before deploying them.</p>

    <form method="POST" action="/">
      <label for="tpl">Template Input</label>
      <textarea id="tpl" name="template" rows="6" placeholder="Try: Hello {{ '{{' }} name {{ '}}' }}!">{{ user_input | e }}</textarea>
      <button class="btn" type="submit">&#9654; Render</button>
    </form>

    {% if error %}
    <div class="error-box">&#9888; {{ error }}</div>
    {% endif %}

    {% if output is not none %}
    <p class="output-label">RENDERED OUTPUT</p>
    <div class="output-box">{{ output }}</div>
    {% endif %}

    <div class="info">
      Variables available: <code>request</code>, <code>config</code>, <code>g</code> &mdash;
      Standard Jinja2 syntax applies. Max 500 chars.
    </div>
  </div>
</body>
</html>
