services:
  web:
    build: .
    container_name: HACKL4BS-Vault-web-hard
    ports:
      - "8080:80"
    environment:
      APP_NAME: "Banco HACKL4BS Vault"
      APP_ENV: ctf
      APP_DEBUG: "false"
      APP_ACTION_SECRET: cambiar_accion_en_deploy
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: reto
      DB_USER: reto_user
      DB_PASSWORD: reto_password
      INITIAL_BALANCE: 20000
      MAX_TRANSFER_AMOUNT: 100
      WINDOW_SECONDS: 60
      MAX_OPERATIONS_PER_WINDOW: 5
      TOKEN_TTL_SECONDS: 15
      UNLOCK_DRIFT: 1200
      MIN_DUPLICATE_APPROVALS: 8
      CONFIRMATION_WINDOW_US: 1200000
      BATCH_CLOSE_WINDOW_US: 1200000
      SETTLEMENT_UNLOCK_DRIFT: 1200
      MIN_DUPLICATE_SETTLEMENTS: 2
      MAX_BATCH_OPERATIONS: 5
      CTF_FLAG: ${CTF_FLAG:-CAMBIAR_EN_PRODUCCION}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    container_name: HACKL4BS-Vault-db-hard
    environment:
      MARIADB_DATABASE: reto
      MARIADB_USER: reto_user
      MARIADB_PASSWORD: reto_password
      MARIADB_ROOT_PASSWORD: root_password
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
