<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Employee Portal - Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f5f5f5; font-family: Arial, sans-serif; padding: 40px 20px; }
    .container { max-width: 700px; margin: 0 auto; }
    .header { background: #1a73e8; color: white; padding: 20px 28px; border-radius: 6px 6px 0 0; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 1.3rem; }
    .badge { background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; text-transform: uppercase; }
    .body { background: white; padding: 28px; border-radius: 0 0 6px 6px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
    .secret-section { background: #e8f5e9; border: 2px solid #4CAF50; border-radius: 6px; padding: 20px; margin-top: 20px; }
    .secret-section h3 { color: #2e7d32; margin-bottom: 10px; }
    .flag-value { font-family: monospace; font-size: 1.05rem; color: #1b5e20; word-break: break-all; background: white; padding: 12px; border-radius: 4px; border: 1px solid #a5d6a7; }
    .info { color: #666; font-size: 0.9rem; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>&#127970; Employee Portal</h1>
      <span class="badge">{{ role }}</span>
    </div>
    <div class="body">
      <p class="info">Logged in as <strong>{{ username }}</strong></p>
      <div class="secret-section">
        <h3>&#128274; Confidential &mdash; Admin Access Required</h3>
        <p style="color:#555; font-size:0.85rem; margin-bottom:12px;">
          This data is restricted to authorized users only.
        </p>
        <div class="flag-value">{{ flag }}</div>
      </div>
    </div>
  </div>
</body>
</html>
