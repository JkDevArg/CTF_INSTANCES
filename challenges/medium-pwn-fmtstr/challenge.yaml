id: medium-pwn-fmtstr
name: "ECHO Corp — Format String"
category: pwn
description: |
  El servicio de logging de ECHO Corp saluda a cada usuario.
  Pero hay algo inusual en cómo procesa el nombre de usuario...

  La flag está guardada en una variable global con dirección estática.
  PIE está deshabilitado. Los especificadores de formato son bienvenidos.

  Protections: NX=on | PIE=off | Canary=off | RELRO=partial
  Architecture: x86-64 ELF, Ubuntu 22.04

ports:
  - 9999
  - 80

timeout: 1800
