id: medium-misc-pyjail
name: "PyJail Corp — Sandbox v1.0"
category: misc
description: |
  Un intérprete Python con builtins restringidos espera conexiones en el puerto 9999.
  La flag está en /home/ctf/flag.txt.
  No tienes open(), exec() ni __import__ — pero Python siempre tiene una salida.

  Builtins disponibles: dir, getattr, hasattr, type, chr, ord, str, int, list, dict, tuple, bool, bytes, print, len, range, repr, hex, bin, oct, abs, id, isinstance

ports:
  - 9999
  - 80
timeout: 1800
