id: hard-pwn-ret2libc
name: "NetSec Corp — ret2libc"
category: pwn
description: |
  Buffer overflow clásico sin función win(). NX habilitado, sin PIE, sin canary.
  Debes construir un ROP chain para llamar a puts() y filtrar la dirección de libc,
  luego calcular system() y "/bin/sh" para obtener una shell.

  Protections: NX=on | PIE=off | Canary=off | RELRO=partial
  Architecture: x86-64 ELF, Ubuntu 22.04 glibc

ports:
  - 9999
  - 80
timeout: 1800
